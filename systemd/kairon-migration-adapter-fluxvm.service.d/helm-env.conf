# Lets the Helm chart drive this host's systemd adapter
# (migration.adapter.hostEnvFile: true). kairon-node's migration-adapter-tls
# container writes /var/lib/kairon/migration-adapter/adapter.env (socket,
# advertise host, KAIRON_MIGRATION_DATA_TLS, cert paths, migration
# networks), and kairon-migration-adapter-fluxvm-env.path restarts this unit
# whenever that file changes. With this drop-in the base unit's ExecStart
# placeholders are never used, so the base unit installs unedited.
# A different migration.adapterHostPath needs the same path here and in
# kairon-migration-adapter-fluxvm-env.path.
# See docs/guides/machine-migration-tls.md#host-systemd-adapter-driven-by-helm.

[Unit]
# Nothing to run until Helm has written the file; the .path unit starts it.
ConditionPathExists=/var/lib/kairon/migration-adapter/adapter.env

[Service]
EnvironmentFile=/var/lib/kairon/migration-adapter/adapter.env
ExecStart=
ExecStart=/usr/bin/kairon-migration-adapter-fluxvm --fluxvm-url=http://127.0.0.1:7788
# kairon-node's pod runs as 65532:65532 and dials the socket (mode 0660) in
# adapterHostPath, so the socket's group must be 65532.
Group=65532
ReadWritePaths=/var/lib/kairon/migration-adapter
