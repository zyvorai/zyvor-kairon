apiVersion: kairon.zyvor.dev/v1
kind: Machine
metadata:
  name: ubuntu-dev
  namespace: default
spec:
  image:
    path: /var/lib/fluxvm/images/ubuntu-24.04.qcow2
  resources:
    cpu: "2"
    memory: 2Gi
  runtime:
    backend: qemu
  network:
    mode: tap
    netns: true
  placement:
    architecture: amd64
  powerState: Running
