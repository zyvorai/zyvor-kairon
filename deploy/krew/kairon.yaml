#
# Krew plugin manifest template for kubectl-kairon.
# Placeholder sha256 values are filled by `make krew-package` / the release
# workflow into dist/krew/kairon.yaml (this file stays the template).
#
# Local install test (after `make krew-package`):
#   kubectl krew install --manifest=dist/krew/kairon.yaml \
#     --archive=dist/krew/kairon_<os>_<arch>.tar.gz
#
# Custom index (this repository): after a release, copy the filled
# manifest to plugins/kairon.yaml (`./scripts/krew-index-sync.sh` or the
# release asset) and merge that to the default branch (do not commit
# placeholder sha256 values; Krew rejects them), then:
#   kubectl krew index add kairon https://github.com/zyvorai/zyvor-kairon.git
#   kubectl krew install kairon/kairon
#
# `kubectl krew install kairon` (default index) needs a PR to
# https://github.com/kubernetes-sigs/krew-index — see docs/RELEASING.md.

apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kairon
spec:
  version: "v0.10.6"
  homepage: https://github.com/zyvorai/zyvor-kairon
  shortDescription: Operate Kairon Machines on Kubernetes
  description: |
    kubectl kairon is the kubectl plugin twin of kaironctl: create and operate
    Machines, migrations, snapshots, and install, upgrade, roll back and
    diagnose the Kairon control plane (embedded Helm chart + Helm SDK; doctor,
    logs, events, sysdump, connectivity test, ui).
  caveats: |
    Uses your kubeconfig like kubectl: pass --kubeconfig PATH and/or
    --context NAME to pick a cluster. KAIRON_KUBE_URL (e.g. after kubectl
    proxy) and the in-cluster service account are honoured when neither flag
    is given.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/zyvorai/zyvor-kairon/releases/download/v0.10.6/kairon_darwin_arm64.tar.gz
    sha256: "PLACEHOLDER_SHA256_DARWIN_ARM64"
    files:
    - from: kubectl-kairon
      to: "."
    - from: LICENSE
      to: "."
    bin: kubectl-kairon
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/zyvorai/zyvor-kairon/releases/download/v0.10.6/kairon_darwin_amd64.tar.gz
    sha256: "PLACEHOLDER_SHA256_DARWIN_AMD64"
    files:
    - from: kubectl-kairon
      to: "."
    - from: LICENSE
      to: "."
    bin: kubectl-kairon
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/zyvorai/zyvor-kairon/releases/download/v0.10.6/kairon_linux_amd64.tar.gz
    sha256: "PLACEHOLDER_SHA256_LINUX_AMD64"
    files:
    - from: kubectl-kairon
      to: "."
    - from: LICENSE
      to: "."
    bin: kubectl-kairon
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/zyvorai/zyvor-kairon/releases/download/v0.10.6/kairon_linux_arm64.tar.gz
    sha256: "PLACEHOLDER_SHA256_LINUX_ARM64"
    files:
    - from: kubectl-kairon
      to: "."
    - from: LICENSE
      to: "."
    bin: kubectl-kairon
