apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-controller}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    # Node maintenance mode cordons and uncordons the node and writes its
    # maintenance-state annotations (internal/controller/maintenance.go).
    resources: ["nodes"]
    verbs: ["patch"]

  - apiGroups: [""]
    # RecordEvent (internal/kube/client.go) posts a real core/v1 Event for
    # a quota-blocked Machine from admitQuota's blocker branch
    # (internal/controller/controller.go) -- so `kubectl describe
    # machine`'s Events tab isn't silent, on top of the existing
    # status.message patch. "create" only: kairon-controller never reads
    # or deletes Events back.
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machines/status", "machinemigrations", "machinemigrations/status", "machinesnapshots", "machinesnapshots/status", "machinenetworkpolicies", "machinenetworkpolicies/status", "networksecuritygroups", "networksecuritygroups/status", "machinequotas", "machinequotas/status", "machinesnapshotrestores", "machinesnapshotrestores/status", "machinesets", "machinesets/status", "machinepools", "machinepools/status", "machineclaims", "machineclaims/status", "migrationpolicies", "migrationpolicies/status", "machinebackups", "machinebackups/status", "machinebackuprestores", "machinebackuprestores/status", "virtualnetworks", "virtualnetworks/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    # Read-only: MachineInstanceType is pure reference data
    # kairon-controller looks up to resolve spec.instanceTypeName, never
    # writes -- see internal/controller/instancetype.go.
    resources: ["machineinstancetypes", "machineimages", "nodetopologies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kairon.zyvor.dev"]
    # MachineSet is the only reason kairon-controller itself ever
    # creates/deletes a Machine directly -- see
    # internal/controller/machineset.go. Every other Machine lifecycle
    # action (create via kaironctl/kairon-ui, delete via the same) stays
    # exactly as it was; this only covers replicas a MachineSet owns.
    resources: ["machines"]
    verbs: ["create", "delete"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machinesnapshotschedules", "machinesnapshotschedules/status", "machinebackuppolicies", "machinebackuppolicies/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    # MachineSnapshotSchedule is the second reason kairon-controller itself
    # creates an object directly (the first is Machine, above, for MachineSet
    # replicas) -- see internal/controller/machinesnapshotschedule.go. The
    # existing get/list/watch/patch rule on machinesnapshots above doesn't
    # cover create; kairon-ui's own separate ClusterRole already grants it
    # create for operator-initiated snapshots, but that's a different
    # ServiceAccount.
    #
    # "delete" belongs in this same rule for a related reason:
    # pruneScheduledSnapshots (also machinesnapshotschedule.go) deletes the
    # oldest ready MachineSnapshots a schedule created once there are more
    # than spec.keepLast of them. This grant was missing from the day
    # keepLast shipped -- scripts/check_rbac_coverage.py (added alongside
    # this fix) now catches this class of gap by cross-checking every
    # internal/kube.Client call kairon-controller/kairon-node/kairon-ui
    # actually make against what their own ClusterRole/Role really grants,
    # the same way this one was found by hand.
    resources: ["machinesnapshots"]
    verbs: ["create", "delete"]
  - apiGroups: ["kairon.zyvor.dev"]
    # MachineBackupPolicy creates S3 MachineBackups and deletes the ones
    # its retention no longer needs (internal/controller/machinebackuppolicy.go).
    resources: ["machinebackups"]
    verbs: ["create", "delete"]
  - apiGroups: ["kairon.zyvor.dev"]
    # A deleting MachinePool deletes the claims bound to its warm members
    # (internal/controller/machinepool.go).
    resources: ["machineclaims"]
    verbs: ["delete"]
  - apiGroups: ["kairon.zyvor.dev"]
    # A MachineClaim's spec.egress becomes a MachineNetworkPolicy the
    # controller creates on bind and deletes on release.
    resources: ["machinenetworkpolicies"]
    verbs: ["create", "delete"]
  - apiGroups: ["kairon.zyvor.dev"]
    # Tenant fence owns one NetworkSecurityGroup per opted-in
    # namespace/tenant (internal/controller/tenantfence.go).
    resources: ["networksecuritygroups"]
    verbs: ["create", "delete"]

  - apiGroups: ["kairon.zyvor.dev"]
    # MachineProtectionPlans (internal/controller/protection.go): the
    # active site owns a dr-<plan> MachineBackupPolicy; failovers and DR
    # tests create Machines and MachineBackupRestores, and a DR test
    # deletes its copies when it ends.
    resources: ["machineprotectionplans", "machineprotectionplans/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machinebackuppolicies", "machinebackuprestores"]
    verbs: ["create", "delete"]


  - apiGroups: ["kairon.zyvor.dev"]
    # cordonEvacuation, memoryPressureEvacuation, nodeMaintenance and
    # automatic DRS are the only reasons kairon-controller itself ever
    # creates a MachineMigration -- see internal/controller/cordon.go,
    # memoryevac.go, maintenance.go and drs.go. With all of them off, only
    # kaironctl/kairon-ui do.
    resources: ["machinemigrations"]
    verbs: ["create"]

  - apiGroups: ["kairon.zyvor.dev"]
    # Read-only on the spec, deliberately no patch here: the admission
    # webhook (webhook.yaml) and kaironctl evacuate both only ever list
    # these to evaluate a MachineMigration create against, kairon-controller
    # itself never writes spec.machinedisruptionbudgets.
    resources: ["machinedisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kairon.zyvor.dev"]
    # Separate rule, /status only: kairon-controller now reconciles real
    # status (expectedMachines/currentHealthy/desiredHealthy/
    # disruptionsAllowed) every tick, mirroring machinequotas/status --
    # see internal/controller/disruption.go's
    # reconcileDisruptionBudgetsStatus. Split from the read-only rule
    # above rather than added to it, so this grant stays status-only, not
    # also patch on spec.
    resources: ["machinedisruptionbudgets/status"]
    verbs: ["patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create"]
  - apiGroups: ["resource.k8s.io"]
    # Read-only: backs the scheduler's DRA topology-awareness hint (see
    # internal/controller/dra.go's buildDRAHints) -- kairon-controller only
    # ever reads an allocation that already happened, it never allocates a
    # device itself.
    resources: ["resourceclaims", "resourceslices"]
    verbs: ["get", "list", "watch"]
