apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-node}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    # patch: the confidential-capable label (internal/agent/attest.go).
    verbs: ["get", "list", "patch"]
  # The KaironMemoryPressure condition (internal/agent/memory.go).
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get"]
  - apiGroups: [""]
    # Edge drop and anomaly Warning Events (internal/agent/edgeevents.go).
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machines/status", "machinemigrations", "machinemigrations/status", "machinenetworkpolicies", "machinenetworkpolicies/status", "networksecuritygroups", "networksecuritygroups/status", "machinebackups", "machinebackups/status", "machinebackuprestores", "machinebackuprestores/status"]
    verbs: ["get", "list", "watch", "patch"]
  # Read-only: internal/agent/hotplug.go's own resize-past-quota self-check
  # (independent of webhook.enabled) needs to list MachineQuotas/Machines
  # cluster-wide the same way the admission webhook's own equivalent check
  # already does -- see internal/controller/quota.go's QuotaTrackersForNamespace,
  # reused directly by both. Never writes a MachineQuota -- kairon-controller's
  # own machinequotas/status patch grant is unaffected.
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machinequotas"]
    verbs: ["get", "list"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get"]
  # VirtualNetwork IPAM read when a Machine is created and the per-node
  # FluxVM sync (internal/agent/virtualnetwork.go). Never written.
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["virtualnetworks"]
    verbs: ["get", "list"]
  # The node's own hardware graph (internal/agent/topology.go).
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["nodetopologies", "nodetopologies/status"]
    verbs: ["get", "create", "patch"]
