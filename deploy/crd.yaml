            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              vni:
                type: integer
              gateway:
                type: string
              observedGeneration:
                type: integer
                format: int64
              allocations:
                type: array
                nullable: true
                description: The network's IPAM, one entry per attached Machine.
                items:
                  type: object
                  required: [machine, ip, mac]
                  properties:
