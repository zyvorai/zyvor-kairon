apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineprotectionplans.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machineprotectionplans
    singular: machineprotectionplan
    kind: MachineProtectionPlan
    shortNames:
    - kmpp
  versions:
  - name: v1
    served: true
    storage: true
    subresources: &subresources
      status: {}
    additionalPrinterColumns: &columns
    - name: Role
      type: string
      jsonPath: .spec.role
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Active
      type: boolean
      jsonPath: .status.active
    - name: Epoch
      type: integer
      jsonPath: .status.epoch
    - name: RPO
      type: number
      jsonPath: .status.rpoSeconds
    - name: Peer
      type: boolean
      jsonPath: .status.peer.reachable
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema: &schema
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - role
            - machines
            - replication
            - peer
            properties:
              role:
                type: string
                enum: [Primary, Secondary]
              machines:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                    dependsOn:
                      type: array
                      items:
                        type: string
              replication:
                type: object
                required:
                - interval
                - target
                properties:
                  interval:
                    type: string
                    pattern: '^([0-9]+d|([0-9]+(\.[0-9]+)?(h|m|s))+)$'
                  fullEvery:
                    type: string
                    pattern: '^([0-9]+d|([0-9]+(\.[0-9]+)?(h|m|s))+)$'
                  target:
                    type: object
                    required:
                    - s3
                    properties:
                      s3:
                        type: object
                        required:
                        - endpoint
                        - bucket
                        - credentialsSecretRef
                        properties:
                          endpoint:
                            type: string
                            pattern: '^https?://'
                          bucket:
                            type: string
                            minLength: 1
                          region:
                            type: string
                          prefix:
                            type: string
                            pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
                          credentialsSecretRef:
                            type: string
                            minLength: 1
                          pathStyle:
                            type: boolean
                  encryption:
                    type: object
                    required:
                    - keySecretRef
                    properties:
                      algorithm:
                        type: string
                        enum: [aes256-gcm]
                      keySecretRef:
                        type: string
                        minLength: 1
                  quiesce:
                    type: string
                    enum: [auto, required, never]
                  retention:
                    type: object
                    properties:
                      hourly:
                        type: integer
                        minimum: 0
                      daily:
                        type: integer
                        minimum: 0
                      monthly:
                        type: integer
                        minimum: 0
              objectives:
                type: object
                properties:
                  rpo:
                    type: string
                    pattern: '^([0-9]+d|([0-9]+(\.[0-9]+)?(h|m|s))+)$'
                  rto:
                    type: string
                    pattern: '^([0-9]+d|([0-9]+(\.[0-9]+)?(h|m|s))+)$'
              peer:
                type: object
                required:
                - server
                - credentialsSecretRef
                properties:
                  server:
                    type: string
                    pattern: '^https://'
                  credentialsSecretRef:
                    type: string
                    minLength: 1
                  namespace:
                    type: string
                  plan:
                    type: string
              test:
                type: object
                properties:
                  bridge:
                    type: string
                  ttl:
                    type: string
                    pattern: '^([0-9]+d|([0-9]+(\.[0-9]+)?(h|m|s))+)$'
                  every:
                    description: Run a DR test on the standby this long after the last one started (at least 5m).
                    type: string
                    pattern: '^([0-9]+d|([0-9]+(\.[0-9]+)?(h|m|s))+)$'
              network:
                type: object
                properties:
                  preserveIP:
                    description: Restore Machines on a VirtualNetwork with the address they had on the active site.
                    type: boolean
                  dns:
                    description: A records the active site publishes as an external-dns DNSEndpoint named dr-<plan>.
                    type: array
                    maxItems: 64
                    items:
                      type: object
                      required:
                      - machine
                      - hostname
                      properties:
                        machine:
                          type: string
                        hostname:
                          type: string
                          maxLength: 253
                        address:
                          type: string
                          enum: [floatingIP, ip, guestIP]
                        ttl:
                          type: integer
                          minimum: 0
              action:
                type: object
                required:
                - type
                - id
                properties:
                  type:
                    type: string
                    enum: [Failover, Test, EndTest]
                  id:
                    type: string
                    minLength: 1
                  planned:
                    type: boolean
          status:
            # Mirrored Machine specs follow the Machine schema, which
            # changes with it.
            type: object
            x-kubernetes-preserve-unknown-fields: true
  - name: v1beta1
    served: true
    storage: false
    deprecated: true
    deprecationWarning: kairon.zyvor.dev/v1beta1 is deprecated; use kairon.zyvor.dev/v1
    subresources: *subresources
    additionalPrinterColumns: *columns
    schema: *schema
  - name: v1alpha1
    served: true
    storage: false
    deprecated: true
    deprecationWarning: kairon.zyvor.dev/v1alpha1 is deprecated; use kairon.zyvor.dev/v1
    subresources: *subresources
    additionalPrinterColumns: *columns
    schema: *schema
