#
# Plain-manifest mirror of charts/kairon/templates/all.yaml's kairon-ui
# resources (gated behind ui.enabled in the Helm chart). Unlike the Helm
# chart, this file cannot fail closed on a missing token at install time --
# replace REPLACE_WITH_A_REAL_TOKEN below before applying, or kairon-ui
# will come up in unauthenticated mode (see cmd/kairon-ui/main.go's own
# refusal: it still requires -allow-unauthenticated to be set explicitly,
# so an empty token here without that flag fails the container's startup,
# not a silent open door).

apiVersion: v1
kind: Secret
metadata:
  name: kairon-ui-token
  namespace: kairon-system
type: Opaque
stringData:
  token: REPLACE_WITH_A_REAL_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kairon-ui
  namespace: kairon-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kairon-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kairon-ui}
    spec:
      serviceAccountName: kairon-ui
      containers:
        - name: ui
          image: ghcr.io/zyvorai/kairon-ui:latest
          imagePullPolicy: IfNotPresent
          args: ["-listen=:18082"]
          env:
            - name: KAIRON_UI_TOKEN
              valueFrom: {secretKeyRef: {name: kairon-ui-token, key: token}}
          ports:
            # HTTPS by default: with no -tls-cert/-tls-key kairon-ui generates
            # a self-signed certificate at startup. Mount a kubernetes.io/tls
            # Secret and set KAIRON_UI_TLS_CERT/KAIRON_UI_TLS_KEY for a stable
            # one, or pass -insecure-http (and switch the probes to HTTP) to
            # serve plain HTTP behind a TLS-terminating proxy.
            - {name: https, containerPort: 18082}
          readinessProbe: {httpGet: {path: /readyz, port: https, scheme: HTTPS}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kairon-ui
  namespace: kairon-system
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: kairon-ui}
  ports:
    - {name: https, port: 18082, targetPort: https, appProtocol: https}
