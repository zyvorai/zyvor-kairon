# Production installation profile for Kairon.
# Usage:
#   helm install kairon charts/kairon -n kairon-system --create-namespace \
#     -f charts/kairon/values-production.yaml
#
# Evaluation installs should keep charts/kairon/values.yaml defaults
# (webhook and multi-tenant hardening off) so demos keep working.

webhook:
  enabled: true

controller:
  image:
    tag: "" # Chart.AppVersion

node:
  image:
    tag: ""
  networkDefaultDeny: true
  interval: 5m

ui:
  image:
    tag: ""
  auth:
    namespaceScoping:
      enabled: true
    # Random generated admin password, not the lab default "Admin@321".
    wellKnownDefault: false

csiNode:
  image:
    tag: ""

csiController:
  image:
    tag: ""

migration:
  enabled: true
  # Require a real per-node dataplane identity in production rather than
  # falling back to the shared control-plane cert.
  dataplaneTls: true
  # Operator must set dataplaneTlsSecretName to a Secret produced by
  # scripts/gen-migration-mtls-certs.sh (or equivalent).
  # dataplaneTlsSecretName: kairon-migration-dataplane

# Network Fabric (FluxVM TC/eBPF edge) — Kairon declares policy; FluxVM owns BPF.
# Recommended per-Machine for production VMs (not a Helm default — set on the CR):
#   spec.network.dataplaneMode: ebpf
#   spec.network.dataplaneRequired: true
# Optional Cilium cluster attach remains off here; enable explicitly:
# network:
#   ciliumAttach:
#     enabled: true
#   ciliumPolicySync:
#     enabled: true
# See docs/network-fabric.md and docs/getting-started.md#network-fabric-ebpf-edge.

# Prefer digest pins in locked-down environments by overriding:
#   controller.image.tag: "0.9.0@sha256:..."
