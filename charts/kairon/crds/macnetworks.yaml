apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: macnetworks.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: macnetworks
    singular: macnetwork
    kind: MacNetwork
    shortNames:
    - kmn
  versions:
  - name: v1
    served: true
    storage: true
    subresources: &subresources
      status: {}
    additionalPrinterColumns: &columns
    - name: Fabric
      type: string
      jsonPath: .spec.fabric
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Subnet
      type: string
      jsonPath: .status.subnet
    - name: Port
      type: integer
      jsonPath: .status.port
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema: &schema
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              fabric:
                description: Only Macs labelled kairon.zyvor.dev/thunderbolt-fabric=<fabric>, over their Thunderbolt addresses. Empty is every Mac, over its InternalIP.
                type: string
                maxLength: 63
              mtu:
                type: integer
                minimum: 1280
                maximum: 9000
              hostsPerNode:
                type: integer
                minimum: 1
                maximum: 253
              keyEpoch:
                description: Raise to rotate the network key; the previous one stays valid until the next rotation.
                type: integer
                minimum: 0
          status:
            type: object
            properties:
              phase:
                type: string
              name:
                type: string
              subnet:
                type: string
              subnetIndex:
                type: integer
              port:
                type: integer
              mtu:
                type: integer
              keyEpoch:
                type: integer
              previousKeyEpoch:
                type: integer
              message:
                type: string
              members:
                type: array
                items:
                  type: object
                  properties:
                    node:
                      type: string
                    hosts:
                      type: array
                      items:
                        type: integer
                    address:
                      type: string
                    underlay:
                      type: string
  - name: v1beta1
    served: true
    storage: false
    deprecated: true
    deprecationWarning: kairon.zyvor.dev/v1beta1 is deprecated; use kairon.zyvor.dev/v1
    subresources: *subresources
    additionalPrinterColumns: *columns
    schema: *schema
  - name: v1alpha1
    served: true
    storage: false
    deprecated: true
    deprecationWarning: kairon.zyvor.dev/v1alpha1 is deprecated; use kairon.zyvor.dev/v1
    subresources: *subresources
    additionalPrinterColumns: *columns
    schema: *schema
