apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinesnapshotrestores.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinesnapshotrestores
    singular: machinesnapshotrestore
    kind: MachineSnapshotRestore
    shortNames:
    - kmsr
  versions:
  - name: v1
    served: true
    storage: true
    subresources: &subresources
      status: {}
    additionalPrinterColumns: &columns
    - name: Snapshot
      type: string
      jsonPath: .spec.snapshotName
    - name: Claim
      type: string
      jsonPath: .status.restoredClaimName
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema: &schema
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - snapshotName
            - targetClaimName
            properties:
              snapshotName:
                type: string
                minLength: 1
              volumeName:
                type: string
              targetClaimName:
                type: string
                minLength: 1
              storageClassName:
                type: string
              storageSize:
                type: string
              machine:
                type: object
                description: Also create a Machine that boots from the
                  restored claim, copied from the snapshot's source spec.
                  The restored volume must be the boot volume (volumes[0]).
                required:
                - name
                properties:
                  name:
                    type: string
                    minLength: 1
                  powerState:
                    type: string
                    enum:
                    - Running
                    - Stopped
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              restoredClaimName:
                type: string
              restoredMachineName:
                type: string
              atlasJobID:
                type: string
  - name: v1beta1
    served: true
    storage: false
    deprecated: true
    deprecationWarning: kairon.zyvor.dev/v1beta1 is deprecated; use kairon.zyvor.dev/v1
    subresources: *subresources
    additionalPrinterColumns: *columns
    schema: *schema
  - name: v1alpha1
    served: true
    storage: false
    deprecated: true
    deprecationWarning: kairon.zyvor.dev/v1alpha1 is deprecated; use kairon.zyvor.dev/v1
    subresources: *subresources
    additionalPrinterColumns: *columns
    schema: *schema
