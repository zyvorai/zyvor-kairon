<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Bar chart: Kairon uses 63 MiB idle control plane memory versus 905 MiB for KubeVirt, and reaches SSH 2.9 times faster for one VM and 7.4 times faster for five">
<!-- Copyright 2026 Zyvor. SPDX-License-Identifier: Apache-2.0 -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121c"/><stop offset="1" stop-color="#0b1f2e"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f7a96"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f5f5f7;text-anchor:middle}
.s{font-size:12px;fill:#9fb3c0}.h{font-size:14px;font-weight:600}.t{font-size:20px;font-weight:650;text-anchor:start}.l{text-anchor:start}
.box{fill:#0e2a3b;stroke:#1f4a63}.hot{fill:#0e2a3b;stroke:#0a84ff;stroke-width:2}.ln{fill:none;stroke:#2b5671;stroke-width:1.6;marker-end:url(#ar)}
.dot{fill:#4cc2ff;filter:url(#glow)}.back{fill:#ff9f0a;filter:url(#glow)}.ok{fill:#30d158;filter:url(#glow)}
@media (prefers-reduced-motion: reduce){animate,animateMotion,animateTransform{display:none}}
</style>
</defs>
<rect width="960" height="360" rx="20" fill="url(#bg)"/>
<text x="40" y="44" class="t">No pod per VM</text>
<text x="40" y="66" class="s l">Same node, same guest, same probe. Measured against KubeVirt v1.9.0 (docs/benchmarks/kairon-vs-kubevirt.md).</text>
<text x="40" y="104" class="s l" style="fill:#f5f5f7">Idle control plane memory</text>
<rect x="40" y="114" width="0" height="20" rx="6" fill="#0a84ff"><animate attributeName="width" from="0" to="38" dur="1.4s" fill="freeze" begin="0.2s"/></rect><text x="88" y="129" class="s l" style="fill:#f5f5f7">Kairon 63 MiB</text>
<rect x="40" y="140" width="0" height="20" rx="6" fill="#ff9f0a"><animate attributeName="width" from="0" to="560" dur="1.4s" fill="freeze" begin="0.5s"/></rect><text x="610" y="155" class="s l" style="fill:#f5f5f7">KubeVirt 905 MiB</text>
<text x="40" y="184" class="s l" style="fill:#f5f5f7">Create to SSH, 1 VM (p50)</text>
<rect x="40" y="194" width="0" height="20" rx="6" fill="#0a84ff"><animate attributeName="width" from="0" to="196" dur="1.4s" fill="freeze" begin="0.2s"/></rect><text x="246" y="209" class="s l" style="fill:#f5f5f7">Kairon 23.7 s</text>
<rect x="40" y="220" width="0" height="20" rx="6" fill="#ff9f0a"><animate attributeName="width" from="0" to="560" dur="1.4s" fill="freeze" begin="0.5s"/></rect><text x="610" y="235" class="s l" style="fill:#f5f5f7">KubeVirt 67.6 s</text>
<text x="40" y="264" class="s l" style="fill:#f5f5f7">Create to SSH, 5 VMs at once (p50)</text>
<rect x="40" y="274" width="0" height="20" rx="6" fill="#0a84ff"><animate attributeName="width" from="0" to="75" dur="1.4s" fill="freeze" begin="0.2s"/></rect><text x="125" y="289" class="s l" style="fill:#f5f5f7">Kairon 24.8 s</text>
<rect x="40" y="300" width="0" height="20" rx="6" fill="#ff9f0a"><animate attributeName="width" from="0" to="560" dur="1.4s" fill="freeze" begin="0.5s"/></rect><text x="610" y="315" class="s l" style="fill:#f5f5f7">KubeVirt 184.7 s</text>
<text x="40" y="346" class="s l">Per-VM memory is the same: both run the same QEMU. The difference is the control plane and the start path.</text>
</svg>
