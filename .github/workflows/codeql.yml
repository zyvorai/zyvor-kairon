name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '1.27.x'
      - if: matrix.language == 'go'
        name: Autobuild Go
        run: |
          go build ./cmd/kairon-controller ./cmd/kairon-node ./cmd/kairon-ui \
            ./cmd/kaironctl ./cmd/kubectl-kairon \
            ./cmd/kairon-csi-node ./cmd/kairon-csi-controller
      - if: matrix.language == 'javascript-typescript'
        name: Build web + website
        run: |
          npm --prefix web ci
          npm --prefix web run build
          npm --prefix website ci
          npm --prefix website run build
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          category: "/language:${{ matrix.language }}"
