# Requires GitHub Pages enabled with Source = "GitHub Actions" (repo Settings
# > Pages), done once via `gh api repos/<org>/<repo>/pages -X POST -f
# build_type=workflow` for this repo.
name: Deploy Docs Site
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    # Self-hosted: GitHub-hosted runners were not being assigned. Safe to run here
    # because this workflow only triggers on pushes to main and manual dispatch,
    # never on pull requests from forks.
    runs-on: [self-hosted, Linux, X64, zyvor-build]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
      with: {node-version: '22', cache: npm, cache-dependency-path: website/package-lock.json}
    - run: npm --prefix website ci
    - run: npm --prefix website run build
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
      with: {path: website/build}
  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, zyvor-build]
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    permissions: {pages: write, id-token: write}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5