# Self-hosted routing: heavy trusted jobs run on the org `zyvor-build` runners
# (shared Docker host, x86_64 only). The runs-on expression falls back to
# ubuntu-latest for pull_request events, so fork PRs never reach self-hosted.

# Publishes to ghcr.io/zyvorai/kairon-{controller,node,ui} on a version tag
# push -- the piece ci.yml's own container job deliberately doesn't do (see
# its comment). Before this workflow existed, nothing in this repository's
# CI published anywhere; the images at ghcr.io/zyvorai/kairon-* were
# produced by some out-of-repo process this repo couldn't vouch for. This
# is now the one place that mints an "official" kairon-* image tag.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","zyvor-build","docker"]') }}
    permissions:
      contents: read
      packages: write
      # Required for cosign's keyless signing below: GitHub mints a
      # short-lived OIDC token for the job, which cosign exchanges for a
      # Fulcio-issued signing certificate tied to this exact workflow/repo/
      # ref -- no private key for this project to generate, store, or
      # rotate.
      id-token: write
    strategy:
      matrix:
        target: [controller, node, ui, csi-node, csi-controller, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      # Per-job docker config dir: the self-hosted runners share one box, so
      # a default ~/.docker/config.json would be shared (and overwritten or
      # logged out) by concurrent jobs. The same value is set on the push step.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ matrix.target }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7
        with:
          version: v0.22.1
      # cosign-installer@v3's own verification logic unconditionally
      # expects a legacy detached .sig file, which cosign itself has fully
      # stopped publishing (confirmed against v3.1.3 -- this workflow's
      # previous explicit pin -- and v3.0.6, cosign-installer@v3's own
      # default: neither ships cosign-linux-amd64.sig anymore, only the
      # newer Sigstore-bundle .sigstore.json, so every download 404'd,
      # curl exit 22 -- confirmed the first time this workflow ever
      # actually ran, on v0.5.0's tag push). cosign-installer@v4's
      # verification logic was updated for the bundle format; no explicit
      # cosign-release override needed, its own default is a real,
      # correctly-verifiable cosign release.
      # Pinned to an exact tag, not a "@v4" moving major -- unlike @v3,
      # this action doesn't publish a moving major-version tag at all
      # (confirmed via the GitHub API: only exact vX.Y.Z tags exist).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # scan those exact bits, and only then `docker push` them -- not a
      # second build-and-push that could, even if only in principle,
      # produce something different from what was scanned.
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: |
            ghcr.io/zyvorai/kairon-${{ matrix.target }}:${{ github.ref_name }}
            ghcr.io/zyvorai/kairon-${{ matrix.target }}:latest
      - name: Scan ${{ matrix.target }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/zyvorai/kairon-${{ matrix.target }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      # Only reached if the scan above passed -- a vulnerable image is
      # never pushed, matching the failurePolicy: Fail posture used
      # elsewhere in this GA pass (fail the guarantee closed, not open).
      #
      # Pushed with crane from a `docker save` tarball, not `docker push`: the
      # shared daemon also holds layers other repos pushed, and `docker push`
      # tries cross-repository blob mounts from them, which GHCR can reject
      # as `unauthenticated` for a token that cannot read the source repo.
      # crane uploads the tarball's blobs straight to this repository and
      # never consults the daemon's distribution metadata.
      - name: Push ${{ matrix.target }} image
        id: push
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ matrix.target }}
        run: |
          set -euo pipefail
          repo="ghcr.io/zyvorai/kairon-${{ matrix.target }}"
          tarball="${RUNNER_TEMP}/kairon-${{ matrix.target }}-image.tar"
          # Same image the scan just checked, exported from the local daemon.
          docker save -o "$tarball" "${repo}:${{ github.ref_name }}"
          crane push "$tarball" "${repo}:${{ github.ref_name }}"
          rm -f "$tarball"
          # Sign/attest by digest, not tag -- a tag is mutable, a digest
          # isn't. Read back what the registry holds for the pushed tag.
          digest="$(crane digest "${repo}:${{ github.ref_name }}")"
          case "$digest" in sha256:*) ;; *) echo "unexpected digest: $digest" >&2; exit 1 ;; esac
          crane tag "${repo}@${digest}" latest
          test "$(crane digest "${repo}:latest")" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM for ${{ matrix.target }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ matrix.target }}
        with:
          image: ghcr.io/zyvorai/kairon-${{ matrix.target }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - name: Sign image and attest SBOM for ${{ matrix.target }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ matrix.target }}
        run: |
          image="ghcr.io/zyvorai/kairon-${{ matrix.target }}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "$image"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.target }}.spdx.json" "$image"
      - name: Upload SBOM artifact for ${{ matrix.target }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom-${{ matrix.target }}-${{ github.ref_name }}
          path: sbom-${{ matrix.target }}.spdx.json
      # Shared Docker daemon: drop only this job's tags, never a global prune.
      - name: Remove ${{ matrix.target }} image tags
        if: always()
        run: |
          docker image rm -f "ghcr.io/zyvorai/kairon-${{ matrix.target }}:${{ github.ref_name }}" "ghcr.io/zyvorai/kairon-${{ matrix.target }}:latest" || true
          rm -rf "${RUNNER_TEMP}/docker-config-${{ matrix.target }}" "${RUNNER_TEMP}/kairon-${{ matrix.target }}-image.tar"

  # CLI binaries, checksums, Helm OCI chart, and GitHub Release assets.
  release-assets:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","zyvor-build","docker"]') }}
    needs: publish
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '1.27.x'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Build CLI binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for os_arch in linux/amd64 linux/arm64; do
            os="${os_arch%/*}"
            arch="${os_arch#*/}"
            for cmd in kaironctl kubectl-kairon; do
              out="dist/${cmd}-${os}-${arch}"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "$out" "./cmd/${cmd}"
            done
          done
          (
            cd dist
            sha256sum kaironctl-* kubectl-kairon-* > SHA256SUMS
          )
      - name: Package kubectl-kairon archives and Krew manifest
        run: |
          set -euo pipefail
          # Reads VERSION, which must equal the tag. Writes
          # dist/krew/kairon_{darwin,linux}_{amd64,arm64}.tar.gz and a filled
          # dist/krew/kairon.yaml (deploy/krew/kairon.yaml stays the template).
          test "$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
          ./scripts/krew-package.sh
      - name: Package and push Helm chart to OCI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Keep chart version aligned with the git tag.
          sed -i "s/^version:.*/version: ${version}/" charts/kairon/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${version}\"/" charts/kairon/Chart.yaml
          helm package charts/kairon -d dist
          helm push "dist/kairon-${version}.tgz" oci://ghcr.io/zyvorai/charts
      - name: Checksum every release asset
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Rewrite SHA256SUMS now that the Krew archives, manifest and chart
          # exist, so one file covers everything attached to the release.
          # Names are bare file names: `sha256sum -c --ignore-missing SHA256SUMS`
          # works from a directory holding any subset of the downloads.
          (
            cd dist
            sha256sum kaironctl-* kubectl-kairon-* "kairon-${version}.tgz" > SHA256SUMS
            (cd krew && sha256sum kairon_*.tar.gz kairon.yaml) >> SHA256SUMS
            test "$(wc -l < SHA256SUMS | tr -d ' ')" = "10"
          )
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          chart_version="${version#v}"
          notes="$(cat <<EOF_NOTES
          ## ${version}

          ### Artifacts
          - \`kaironctl\` / \`kubectl-kairon\` (linux amd64/arm64) + \`SHA256SUMS\` covering every asset below (chart, Krew archives and manifest included)
          - Krew: \`kairon_{darwin,linux}_{amd64,arm64}.tar.gz\` + a checksummed \`kairon.yaml\` manifest
          - Container images: \`ghcr.io/zyvorai/kairon-{controller,node,ui,csi-node,csi-controller,mcp}:${version}\` (cosign-signed, SBOM attested; \`kairon-mcp\` is the MCP Registry package)
          - Helm chart (OCI): \`oci://ghcr.io/zyvorai/charts/kairon:${chart_version}\`

          ### Upgrade / rollback
          \`\`\`bash
          helm upgrade kairon oci://ghcr.io/zyvorai/charts/kairon --version ${chart_version} -n kairon-system
          helm rollback kairon -n kairon-system
          \`\`\`

          Compatibility evidence: see \`docs/COMPATIBILITY.md\` in this tag.
          Production installs: \`-f values-production.yaml\`.
          EOF_NOTES
          )"
          # Strip leading indentation from heredoc for GitHub.
          notes="$(printf '%s\n' "$notes" | sed 's/^          //')"
          gh release create "$version" \
            dist/kaironctl-linux-amd64 \
            dist/kaironctl-linux-arm64 \
            dist/kubectl-kairon-linux-amd64 \
            dist/kubectl-kairon-linux-arm64 \
            dist/SHA256SUMS \
            dist/krew/kairon_darwin_arm64.tar.gz \
            dist/krew/kairon_darwin_amd64.tar.gz \
            dist/krew/kairon_linux_amd64.tar.gz \
            dist/krew/kairon_linux_arm64.tar.gz \
            dist/krew/kairon.yaml \
            "dist/kairon-${chart_version}.tgz" \
            --title "$version" \
            --notes "$notes"

  # MCP Registry metadata only: the kairon-mcp image built above is what
  # clients pull. Tag pushes only (the workflow only triggers on tags).
  publish-mcp:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","zyvor-build","docker"]') }}
    needs: publish
    permissions:
      contents: read
      id-token: write   # GitHub OIDC login to the MCP Registry, no long-lived token
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: server.json matches the tag
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')" = "${GITHUB_REF_NAME#v}"
          grep -q "\"ghcr.io/zyvorai/kairon-mcp:${GITHUB_REF_NAME}\"" server.json
      - name: Install mcp-publisher (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
